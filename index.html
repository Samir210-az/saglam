<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ağıllı Arıqlama | 20+ yaş üçün fərdi plan</title>
    <!-- html2canvas (şəkil çıxarışı üçün) -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(145deg, #0b170b, #121f10);
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'), radial-gradient(circle at 20% 30%, rgba(255,140,66,0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }
        .main-card {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(18, 26, 16, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 140, 66, 0.5);
            position: relative;
            z-index: 2;
        }
        .athletic-header {
            background: linear-gradient(95deg, #1e2c1c, #2f462a);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e67e22;
        }
        .title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFE3B5;
            letter-spacing: -0.5px;
        }
        .title p {
            color: #c7e0bc;
            font-size: 0.75rem;
        }
        .by {
            font-size: 0.85rem;
            color: #ffc285;
            background: #00000040;
            padding: 5px 15px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .selection-panel {
            background: #1f2c1cbb;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #3c5534;
        }
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }
        .input-field {
            flex: 1;
            min-width: 130px;
        }
        .input-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #FFD9A5;
            font-size: 0.8rem;
        }
        .input-field input, .input-field select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 60px;
            border: none;
            background: #2c3d26;
            color: white;
            font-weight: 500;
            outline: none;
            border: 1px solid #e67e2266;
            font-family: inherit;
        }
        .btn-create, .btn-image, .btn-html {
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.1s;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .btn-create {
            background: #e67e22;
            box-shadow: 0 4px 0 #9b4a0e;
        }
        .btn-create:active { transform: translateY(2px); box-shadow: 0 2px 0 #9b4a0e; }
        .btn-image {
            background: #2a6f8f;
            box-shadow: 0 4px 0 #154c63;
        }
        .btn-image:active { transform: translateY(2px); box-shadow: 0 2px 0 #154c63; }
        .btn-html {
            background: #8e5a2a;
            box-shadow: 0 4px 0 #5e3a1a;
        }
        .btn-html:active { transform: translateY(2px); box-shadow: 0 2px 0 #5e3a1a; }
        
        .result-area {
            padding: 1.8rem;
            background: #faf9f0;
            display: none;
            border-radius: 2rem 2rem 0 0;
            color: #1e2a1a;
        }
        .result-area.show { display: block; }
        .param-header {
            background: #eef1e6;
            border-radius: 1.5rem;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            border: 1px solid #dadfc8;
        }
        .param-item {
            background: white;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: visible;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stat-pills {
            background: #eef1e6;
            border-radius: 1.5rem;
            padding: 0.8rem 1.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-pill {
            background: white;
            border-radius: 40px;
            padding: 5px 15px;
            font-weight: 600;
            white-space: nowrap;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 1.2rem 0 0.8rem;
            border-left: 5px solid #e67e22;
            padding-left: 1rem;
        }
        .meal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .meal-card {
            background: white;
            border-radius: 1.2rem;
            padding: 1rem;
            border-top: 3px solid #e67e22;
        }
        .exercise-card {
            background: #ffffffd9;
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            margin: 0.6rem 0;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .week-item {
            background: #fffdf5;
            border-radius: 1rem;
            margin-bottom: 0.8rem;
            border: 1px solid #e6ddc4;
        }
        .week-header {
            background: #2c5e2a;
            color: white;
            padding: 0.7rem 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .week-detail {
            padding: 0.8rem 1.2rem;
            display: none;
            background: #ffffffec;
            line-height: 1.5;
        }
        .week-detail.show-detail { display: block; }
        .footer-rights {
            text-align: center;
            margin-top: 1.5rem;
            padding: 0.8rem;
            font-size: 0.7rem;
            color: #5f7357;
            border-top: 1px solid #d9e0ce;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        @media (max-width: 680px) {
            .selection-panel, .result-area { padding: 1rem; }
            .athletic-header { padding: 0.8rem; }
            .param-item, .stat-pill { white-space: normal; }
        }
    </style>
</head>
<body>
<div class="main-card">
    <div class="athletic-header">
        <div class="title">
            <h1><i class="fas fa-brain"></i> Ağıllı Arıqlama Proqramı</h1>
            <p>20+ yaş üçün adaptiv sistem | Yüngül hərəkət + fərdi menyu</p>
        </div>
        <div class="by"><i class="fab fa-instagram"></i> @s_akhundoff</div>
    </div>

    <div class="selection-panel">
        <div class="input-row">
            <div class="input-field"><label><i class="fas fa-calendar-alt"></i> Yaş (30+)</label><input type="number" id="age" value="42"></div>
            <div class="input-field"><label><i class="fas fa-ruler"></i> Boy (sm)</label><input type="number" id="height" value="173"></div>
            <div class="input-field"><label><i class="fas fa-weight-hanging"></i> Çəki (kq)</label><input type="number" id="weight" value="107" step="0.5"></div>
            <div class="input-field"><label><i class="fas fa-venus-mars"></i> Cins</label><select id="gender"><option value="male">Kişi</option><option value="female">Qadın</option></select></div>
        </div>
        <div class="button-group">
            <button class="btn-create" id="generateBtn"><i class="fas fa-dumbbell"></i> Proqramı Yarat</button>
            <button class="btn-image" id="saveImageBtn"><i class="fas fa-camera"></i> Şəkil (PNG)</button>
            <button class="btn-html" id="downloadHtmlBtn"><i class="fas fa-file-code"></i> HTML faylı</button>
        </div>
    </div>

    <div id="resultArea" class="result-area">
        <div id="dynamicPlanContent"></div>
        <div class="footer-rights"><i class="fas fa-copyright"></i> 2025 Bütün hüquqlar qorunur.</div>
    </div>
</div>
